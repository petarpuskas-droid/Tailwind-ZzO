<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Krasotica | Upis</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800">

    <header class="sticky top-0 bg-white border-b border-gray-200">
        <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
            <a href="index.html" class="text-x1 font-bold text-yellow-700 hover:text-yellow-500">Knjižnica Krasotica</a>
            <nav class="hidden md:flex gap-6">
                <a href="index.html" class="text-yellow-700 hover:font-bold hover:text-yellow-500">Naslovnica</a>
                <a href="book.html" class="text-yellow-700 hover:font-bold hover:text-yellow-500">Popis knjiga</a>
                <a href="enroll.html" class="text-yellow-700 hover:font-bold hover:text-yellow-500">Upis</a>
            </nav>
        </div>
    </header>

    <nav class="md:hidden bg-white border-b border-gray-200">
        <div class="flex justify-around py-2 text-sm">
            <a href="index.html" class="text-yellow-700 hover:font-bold hover:text-yellow-500">Naslovnica</a>
            <a href="book.html" class="text-yellow-700 hover:font-bold hover:text-yellow-500">Popis knjiga</a>
            <a href="enroll.html" class="text-yellow-700 hover:font-bold hover:text-yellow-500">Upis</a>
        </div>
    </nav>

    <section class="max-w-2xl mx-auto px-4 py-12">
        <h1 class="text-2xl font-bold mb-6">Rezervirajte knjigu! Ili se prijavite za projekt!</h1>

        <form flex flex-col gap-4>

            <div class="flex flex-col md:flex-row gap-4">

                <div class="flex flex-col gap-1 w-full">
                    <label for="name" class="text-sm font-medium">Ime i prezime:</label>
                    <input type="text" id="name" name="name" 
                    class="border border-gray-300 rounded-md px-3 py-2 focus:border-teal-600 focus:outline-none">
                </div>

                <div class="flex flex-col gap-1 w-full">
                    <label for="email" class="text-sm font-medium">(vaša) E-mail adresa:</label>
                    <input type="email" id="email" name="email" 
                    class="border border-gray-300 rounded-md px-3 py-2 focus:border-teal-600 focus:outline-none">
                </div>
            </div>

            <div class="flex flex-col gap-1">
                <label for="message" class="text-sm font-medium">Poruka:</label>
                <textarea id="message" name="message" rows="4"
                    class="border border-gray-300 rounded-md px-3 py-2 focus:border-teal-600 focus:outline-none"></textarea>
            </div>
            <br>
            <button type="submit" 
                class="bg-blue-900 text-white font-semibold px-6 py-4 rounded-lg hover:underline">
                Pošalji prijavu
            </button>
            <br>
            <p class="py-6">Odgovor Vam šaljemo na mail!</p>
        </form>

    </section>

    <footer class="bg-blue-900 text-gray-300">
        <div class="max-w-5xl mx-auto px-4 py-8 flex flex-col md:flex-row justify-between gap-4 text-sm">
            <p>Krasotica, Trg bana Jelačića 3, Virje</p>
            <p>Radnim danom 9 - 17, subotom 7 - 13</p>
        </div>
    </footer>
</body>
</html>
